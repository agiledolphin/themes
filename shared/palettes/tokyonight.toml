# TokyoNight Mod — single source of truth for both platforms.
# Generated from this file by scripts/gen-themes.py (never edit the outputs):
#   obsidian/tokyonight/theme.css, obsidian/tokyonight/manifest.json, typora/tokyonight/*.css

name = "TokyoNight Mod"
prefix = "tn"                 # CSS variable / class prefix
obsidian_version = "1.5.0"
typora_version = "1.4.1"
tagline = ["Palette: github.com/folke/tokyonight.nvim"]
min_app_version = "1.0.0"         # Obsidian manifest fields
author = "Jiaming Sun"
author_url = ""

# Style Settings wording. The ids derived from settings_noun (e.g. tn-dark-scheme) must stay stable:
# changing them silently resets every user's saved variant choice.
settings_noun = "scheme"
settings_desc_noun = "variant"

# Palette colors that also get a --<prefix>-<name>-rgb triple (for rgba()).
rgb = ["blue", "cyan", "green", "yellow", "orange", "red", "magenta", "teal", "comment"]

# Templates use canonical color names (blue, magenta, orange, green, red, cyan,
# yellow, teal, comment); map any that this palette names differently.
[aliases]

# Roles: palette color names (or literal values) the templates plug in.
[roles]
accent = "blue"
accent_hover = "cyan"
highlight = "blue"
table_header = "blue"
table_hover_alpha = "0.20"
tag = "blue"
tag_hover = "cyan"
search = "orange"
callout_note = "blue"
graph_tag = "magenta"
quote_nested = "magenta"
tooltip = "blue"
tooltip_text_alpha = "0.85"
tooltip_border_alpha = "0.45"
tooltip_shadow = "0 2px 8px rgba(0, 0, 0, 0.15)"
nav_style = "tint"
nav_hover = ""
nav_active = ""
menu_style = "tint"
mark_alpha = "0.20"
headings = ["blue", "cyan", "teal", "green", "yellow", "comment"]   # H1..H6

[[variants]]
slug = "storm"
label = "Storm"
mode = "dark"
[variants.palette]
bg        = "#24283b"
bg-dark   = "#1f2335"
bg-hl     = "#292e42"
gutter    = "#3b3d57"
fg        = "#c0caf5"
