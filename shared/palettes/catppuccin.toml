# Typora current find hit: Latte's peach is mid-luminance, so neither light nor dark
# text clears 3:1 on it solid — use a strong tint with the normal text color (4.0:1).
typora_overrides = { mark_alpha = "0.20", search_select_alpha = "0.55", search_select_text = "fg" }
