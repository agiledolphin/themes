# Catppuccin Mod — single source of truth for both platforms.
# Generated from this file by scripts/gen-themes.py (never edit the outputs):
#   obsidian/catppuccin/theme.css, obsidian/catppuccin/manifest.json, typora/catppuccin/*.css

name = "Catppuccin Mod"
prefix = "cp"                 # CSS variable / class prefix
obsidian_version = "1.3.3"
typora_version = "1.3.1"
tagline = ["Palette: catppuccin.com"]
min_app_version = "1.0.0"         # Obsidian manifest fields
author = "Jiaming Sun"
author_url = ""

# Style Settings wording. The ids derived from settings_noun (e.g. cp-dark-flavor) must stay stable:
# changing them silently resets every user's saved variant choice.
settings_noun = "flavor"
settings_desc_noun = "flavor"

# Palette colors that also get a --<prefix>-<name>-rgb triple (for rgba()).
rgb = ["lavender", "blue", "cyan", "teal", "green", "yellow", "orange", "red", "magenta", "comment", "rosewater"]

# Templates use canonical color names (blue, magenta, orange, green, red, cyan,
# yellow, teal, comment); map any that this palette names differently.
[aliases]

# Roles: palette color names (or literal values) the templates plug in.
[roles]
accent = "lavender"
accent_hover = "magenta"
highlight = "blue"
table_header = "magenta"
table_hover_alpha = "0.20"
tag = "magenta"
tag_hover = "magenta"
search = "orange"
callout_note = "lavender"
graph_tag = "magenta"
quote_nested = "magenta"
tooltip = "rosewater"
tooltip_text_alpha = "0.80"
tooltip_border_alpha = "0.60"
tooltip_shadow = "0 0 4px rgba(var(--cp-rosewater-rgb), 0.15)"
nav_style = "fill"
nav_hover = "lavender"
nav_active = "magenta"
menu_style = "fill"
mark_alpha = "0.20"
headings = ["lavender", "magenta", "blue", "teal", "green", "comment"]   # H1..H6

[[variants]]
slug = "mocha"
label = "Mocha"
mode = "dark"
[variants.palette]
bg        = "#1e1e2e"
